services:
  # Cache descartável: não grava em disco. volatile-lru só remove chaves com validade,
  # então o contador de geração do cache nunca é descartado por falta de memória.
  redis:
    image: redis:8.2-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy volatile-lru --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
